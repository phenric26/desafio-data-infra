# docker-compose.yml (VERSÃO FINAL CORRIGIDA)

services:
  postgres:
    image: postgres:13
    container_name: postgres_service
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.7.2
    container_name: airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER_AIRFLOW}:${POSTGRES_PASSWORD_AIRFLOW}@postgres:5432/${POSTGRES_DB_AIRFLOW}
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
    command: bash -c "airflow db migrate && airflow users create --username ${ADMIN_USER} --password ${ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${ADMIN_EMAIL}"

  airflow-webserver:
    image: apache/airflow:2.7.2
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER_AIRFLOW}:${POSTGRES_PASSWORD_AIRFLOW}@postgres:5432/${POSTGRES_DB_AIRFLOW}
      - AIRFLOW__WEBSERVER__SECRET_KEY=a_super_secret_key_for_webserver
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
    user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
    ports:
      - "8080:8080"
    command: airflow webserver
    volumes:
      - ./dags:/opt/airflow/dags

  airflow-scheduler:
    image: apache/airflow:2.7.2
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER_AIRFLOW}:${POSTGRES_PASSWORD_AIRFLOW}@postgres:5432/${POSTGRES_DB_AIRFLOW}
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
    user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
    command: airflow scheduler

  superset:
    build:
      context: ./superset
    container_name: superset_service
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SUPERSET_SECRET_KEY=a_super_secret_key_for_superset
    ports:
      - "8088:8088"
    volumes:
      - superset_data:/app/superset_home
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  postgres_data:
  superset_data: